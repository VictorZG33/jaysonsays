# The server behind 杰神模拟器 Jieshen Simulator (wentaoz.com/jaysonsays/).
# .github/workflows/worker.yml deploys it whenever this folder, sim.js or reviews.js changes on main.
name = "jaysonsays"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true      # served at https://jaysonsays.<your subdomain>.workers.dev

# At most 3 questions per minute from one IP address, counted per Cloudflare location.
# A question takes longer than that anyway; this only slows down a script hammering the Worker.
[[ratelimits]]
name = "ASK_LIMIT"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 3
  period = 60

# The answers it keeps (see worker.js). No id: wrangler deploy creates the namespace the first time,
# named jaysonsays-answers, and later deploys keep using the one the Worker is bound to.
[[kv_namespaces]]
binding = "ANSWERS"
