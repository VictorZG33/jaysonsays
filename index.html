<style>
/* Layout: one column like a critic's tasting sheet. The bottle (photo or name) first, then the
   verdict: what the wine is, then the score set large in Bodoni. Wine Moon's limestone and garnet,
   since it is the same cellar. A score he published is a solid garnet seal; a simulated one is the
   same seal drawn in a dashed line, so the two never look alike. */
:root {
  --bg: #EFEEE8;
  --surface: #F7F6F1;
  --fg: #1F1A1C;
  --muted: #6B6366;
  --rule: #D5D1C8;
  --rule-strong: #9C958F;
  --garnet: #8A1C2D;  --garnet-soft: #EBD3D6;
  --gold: #8C6312;    --gold-soft: #EFE3C2;
  --on-garnet: #F7F6F1;
  --display-latin: "Bodoni Moda", "Didot", "Bodoni 72", "Times New Roman", serif;
  --display-cjk: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "SimSun", serif;
  --body: "IBM Plex Sans", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141A; --surface: #1F1B22; --fg: #ECE6DF; --muted: #9A918E; --rule: #352F36; --rule-strong: #5A535B;
    --garnet: #E0667A; --garnet-soft: #3B2228; --gold: #E2B657; --gold-soft: #3A2F17; --on-garnet: #17141A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17141A; --surface: #1F1B22; --fg: #ECE6DF; --muted: #9A918E; --rule: #352F36; --rule-strong: #5A535B;
  --garnet: #E0667A; --garnet-soft: #3B2228; --gold: #E2B657; --gold-soft: #3A2F17; --on-garnet: #17141A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--garnet); outline-offset: 2px; }
a { color: inherit; text-decoration-color: var(--garnet); text-underline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* header */
.home { display: inline-block; margin-bottom: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.home:hover, .home:focus-visible { color: var(--fg); }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rule-strong); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand .name { font-family: var(--display-cjk); font-weight: 900; font-size: 22px; letter-spacing: 0.06em; }
.brand .name-latin { font-family: var(--display-latin); font-style: italic; font-size: 20px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
/* keeps 杰神 in one piece inside English lines */
.lang-en .eyebrow, .lang-en .lead, .lang-en .step-h, .lang-en .btn { word-break: keep-all; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.pill {
  appearance: none; border: 1px solid var(--rule-strong); border-radius: 999px; background: transparent; color: var(--muted);
  font: 500 12px/1 var(--body); padding: 7px 11px; cursor: pointer; letter-spacing: 0.04em;
}
.pill[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.lang { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; flex: none; }
.lang button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 12px/1 var(--body); padding: 7px 11px; cursor: pointer; letter-spacing: 0.04em; }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* intro */
.hero { display: grid; gap: 14px; padding-block: 28px 4px; }
.lead { margin: 0; font-size: clamp(19px, 3.6vw, 23px); line-height: 1.4; font-weight: 500; max-width: 34em; }
.lead-sub { margin: 0; color: var(--muted); max-width: 40em; }

/* steps */
.step { padding-block: 34px 4px; }
.step-h { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 19px; font-weight: 600; line-height: 1.3; }
.step-h .no {
  display: inline-grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%;
  background: var(--fg); color: var(--bg); font: 500 13px/1 var(--mono);
}
.hint { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); }
.msg { margin: 10px 0 0; font-size: 14.5px; }
.msg:empty { display: none; }
.msg.bad { color: var(--garnet); }

.ask { display: grid; gap: 16px; }
.drop {
  display: grid; justify-items: center; gap: 6px; padding: 26px 16px; text-align: center; cursor: pointer;
  background: var(--surface); border: 1.5px dashed var(--rule-strong); border-radius: 14px;
}
.drop:hover, .drop.over { border-color: var(--garnet); background: var(--garnet-soft); }
.drop:focus-within { outline: 2px solid var(--garnet); outline-offset: 2px; }
.drop .big { font-size: 17px; font-weight: 600; }
.drop .small { font-size: 13.5px; color: var(--muted); max-width: 30em; }
.drop svg { width: 34px; height: 34px; color: var(--garnet); }
.photo { display: flex; align-items: center; gap: 14px; padding: 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; }
.photo img { width: 88px; height: 88px; object-fit: cover; border-radius: 8px; background: var(--rule); flex: none; }
.photo .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.photo p { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.field { display: grid; gap: 6px; }
.label { font-size: 13px; font-weight: 500; color: var(--muted); }
input[type="text"], input[type="password"] {
  width: 100%; min-height: 44px; padding: 10px 12px; font-size: 16px; line-height: 1.4;
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 8px;
}
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--garnet); flex: none; }
.btn {
  appearance: none; min-height: 44px; padding: 10px 16px; border: 1px solid var(--rule-strong); border-radius: 8px;
  background: var(--surface); font-size: 15px; font-weight: 500; line-height: 1.2; cursor: pointer;
}
.btn:hover { border-color: var(--fg); }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13.5px; }
.btn.primary { background: var(--garnet); color: var(--on-garnet); border-color: var(--garnet); min-width: 9em; }
.btn:disabled { opacity: 0.5; cursor: default; }

/* progress: one line per thing Claude does, the newest one spinning */
.steps { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.steps li { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.steps li::before { content: "✓"; flex: none; width: 14px; color: var(--garnet); font-weight: 600; }
.steps li span { overflow-wrap: anywhere; }
.steps li.now::before { content: ""; align-self: center; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--rule-strong); border-top-color: var(--garnet); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .steps li.now::before { animation: none; } }

/* the wine */
.wine { padding: 16px 0 18px; border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule); }
.kicker { margin: 0 0 6px; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.kicker b { color: var(--fg); font-weight: 500; }
.wine-name { margin: 0; font-family: var(--display-latin); font-weight: 700; font-size: clamp(22px, 5vw, 28px); line-height: 1.2; overflow-wrap: anywhere; }
.wine-name .cuvee { display: block; font-weight: 400; font-style: italic; font-size: 0.78em; margin-top: 2px; }
.wine-name .vint { font-family: var(--mono); font-weight: 500; font-style: normal; font-size: 0.62em; color: var(--garnet); margin-left: 0.35em; letter-spacing: 0.02em; white-space: nowrap; }
.lang-zh .wine-name { font-family: var(--display-latin), var(--display-cjk); }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 14px 0 0; font-size: 14.5px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.wine-notes { margin: 10px 0 0; font-size: 14px; color: var(--muted); }

/* the verdict */
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px 24px; padding: 22px 0 6px; }
@media (max-width: 520px) { .verdict { grid-template-columns: minmax(0, 1fr); } }
.seal {
  display: grid; justify-items: center; align-content: center; gap: 2px; width: 148px; height: 148px; border-radius: 50%;
  background: var(--garnet); color: var(--on-garnet); text-align: center; align-self: start;
}
.seal .stamp { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; }
.lang-zh .seal .stamp { font-family: var(--display-cjk); font-size: 13px; letter-spacing: 0.3em; text-transform: none; margin-right: -0.3em; }
.seal .score { font-family: var(--display-latin); font-weight: 700; font-size: 58px; line-height: 1; font-variant-numeric: lining-nums; letter-spacing: -0.01em; }
.seal .scale { font-family: var(--mono); font-size: 11px; opacity: 0.85; }
.verdict.predicted .seal { background: transparent; color: var(--garnet); border: 2px dashed var(--garnet); }
.verdict.none .seal { background: transparent; color: var(--muted); border: 2px dashed var(--rule-strong); }
.verdict.none .seal .score { font-family: var(--body); font-weight: 500; font-size: 44px; }
.seal .star { font-style: normal; font-family: var(--body); font-size: 0.5em; vertical-align: 0.45em; margin-left: 0.04em; }
.seal .score.long { font-size: 28px; line-height: 1.1; padding: 0 14px; overflow-wrap: anywhere; }
.seal .score.words { font-family: var(--display-cjk); font-weight: 900; font-size: 24px; line-height: 1.25; padding: 4px 14px; overflow-wrap: anywhere; }
.say { min-width: 0; }
.review { margin: 0; font-family: var(--display-cjk); font-weight: 600; font-size: 17.5px; line-height: 1.7; }
.lang-en .review { font-family: var(--display-latin); font-weight: 400; font-style: italic; font-size: 19px; line-height: 1.55; }
.review::before { content: "“"; color: var(--garnet); margin-right: 1px; }
.review::after { content: "”"; color: var(--garnet); margin-left: 1px; }
.byline { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.why-h { margin: 18px 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.why { margin: 0; font-size: 14.5px; }
.srcs { margin: 4px 0 0; padding-left: 1.2em; font-size: 14px; }
.srcs li { overflow-wrap: anywhere; }
.srcs li + li { margin-top: 3px; }
.srcs .d { color: var(--muted); font-family: var(--mono); font-size: 12.5px; margin-left: 6px; }
.history { margin: 0 0 12px; font-size: 14px; }
.history b { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.interest { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; background: var(--gold-soft); font-size: 13.5px; }
.interest b { font-weight: 600; margin-right: 8px; }
.key { margin: 14px 0 0; font-size: 13px; color: var(--muted); }
.sogou { margin: 14px 0 0; font-size: 13.5px; color: var(--muted); }
.sogou a { color: var(--fg); }

/* 杰神 among the other critics, on one line of the 100-point scale */
.critics { margin-top: 22px; padding: 14px 16px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }
.critics h4 { margin: 0 0 30px; font-size: 13px; font-weight: 600; color: var(--muted); }
.track { position: relative; height: 2px; margin: 0 14px; background: var(--rule-strong); }
.dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; background: var(--fg); }
.dot.jie { width: 16px; height: 16px; background: var(--garnet); z-index: 1; }
.dot.jie.hollow { background: var(--surface); border: 2px dashed var(--garnet); }
.dot b { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font: 500 12px/1 var(--mono); white-space: nowrap; }
.dot.jie b { color: var(--garnet); }
.ticks { display: flex; justify-content: space-between; margin: 10px 14px 0; font: 400 11px/1 var(--mono); color: var(--muted); }
.who { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.who b { color: var(--fg); font-weight: 600; font-family: var(--mono); font-size: 12.5px; }
.who a { color: inherit; }

.fine { margin: 18px 0 0; padding: 10px 14px; border-radius: 8px; background: var(--gold-soft); font-size: 13.5px; }
.prose { font-size: 15px; line-height: 1.65; }
.prose p { margin: 0 0 10px; }
.meta { margin: 12px 0 0; font: 400 12.5px/1.5 var(--mono); color: var(--muted); }
.meta:empty { display: none; }
.again { margin: 12px 0 0; }

/* method */
details { border-top: 1px solid var(--rule); margin-top: 40px; }
summary { cursor: pointer; padding: 16px 0; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: var(--mono); color: var(--muted); font-size: 18px; }
details[open] summary::after { content: "–"; }
.method { padding: 0 0 18px; font-size: 14.5px; max-width: 62ch; }
.method p { margin: 0 0 12px; }
.method .k { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--rule-strong); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
footer .sig { font-family: var(--display-latin); font-style: italic; font-size: 16px; color: var(--fg); }
.lang-zh footer .sig { font-family: var(--display-cjk); font-style: normal; font-weight: 900; letter-spacing: 0.06em; }
.nojs { margin: 22px 0 0; font-size: 17px; max-width: 34em; }
</style>
<noscript><style>.tools, .step, details, footer { display: none; }</style></noscript>
</head>
<body>
<div class="page lang-zh" id="page">
  <header class="top">
    <div>
      <a class="home" href="../">← wentaoz.com</a>
      <div class="brand"><span class="name" lang="zh-CN">杰神模拟器</span><span class="name-latin" lang="en">Jieshen Simulator</span></div>
      <div class="eyebrow" id="eyebrow"></div>
    </div>
    <div class="tools">
      <button type="button" class="pill" id="btn-theme" aria-pressed="false" hidden></button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="btn-zh" aria-pressed="true" lang="zh-CN">中文</button>
        <button type="button" id="btn-en" aria-pressed="false" lang="en">EN</button>
      </div>
    </div>
  </header>

  <noscript><p class="nojs">杰神模拟器需要 JavaScript。请开启后刷新页面。<br><span lang="en">Jieshen Simulator needs JavaScript. Turn it on and reload.</span></p></noscript>

  <section class="hero">
    <p class="lead" id="lead"></p>
    <p class="lead-sub" id="lead-sub"></p>
  </section>

  <section class="step" aria-labelledby="h-ask">
    <h2 class="step-h"><span class="no" aria-hidden="true">1</span><span id="h-ask"></span></h2>
    <form class="ask" id="ask" novalidate>
      <label class="drop" id="drop" for="file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2l1.5-2h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.8"/></svg>
        <span class="big" id="drop-big"></span>
        <span class="small" id="drop-small"></span>
        <input type="file" id="file" accept="image/*" class="sr">
      </label>
      <div class="photo" id="photo" hidden>
        <img id="photo-img" alt="">
        <div>
          <p id="photo-text"></p>
          <div class="acts">
            <button type="button" class="btn small" id="photo-change"></button>
            <button type="button" class="btn small" id="photo-drop"></button>
          </div>
        </div>
      </div>
      <div class="field">
        <label class="label" for="text-input" id="text-label"></label>
        <input type="text" id="text-input" maxlength="200" autocomplete="off" enterkeyhint="go">
        <p class="hint" id="text-hint"></p>
      </div>
      <div class="field" id="mode-box">
        <label class="check"><input type="checkbox" id="own-key"><span id="own-key-label"></span></label>
        <p class="hint" id="mode-hint"></p>
      </div>
      <div class="field" id="key-box">
        <label class="label" for="key-input" id="key-label"></label>
        <input type="password" id="key-input" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
        <label class="check"><input type="checkbox" id="key-keep"><span id="key-keep-label"></span></label>
        <p class="hint" id="key-hint"></p>
      </div>
      <div><button type="submit" class="btn primary" id="go"></button></div>
      <p class="msg" id="ask-msg" role="alert"></p>
    </form>
  </section>

  <section class="step" id="step-out" aria-labelledby="h-out" hidden>
    <h2 class="step-h"><span class="no" aria-hidden="true">2</span><span id="h-out"></span></h2>
    <ol class="steps" id="steps" aria-live="polite"></ol>
    <div id="out"></div>
    <p class="meta" id="meta"></p>
    <p class="again" id="again" hidden><button type="button" class="btn small" id="again-btn"></button></p>
  </section>

  <details id="method-box">
    <summary id="method-h"></summary>
    <div class="method" id="method"></div>
  </details>

  <footer>
    <span class="sig" id="foot-sig"></span>
    <span id="foot-note"></span>
  </footer>
</div>

<script type="module">
// ---------- settings ----------

const mqDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
const isDark = () => { const t = root.getAttribute('data-theme'); return t ? t === 'dark' : !!(mqDark && mqDark.matches); };
const showTheme = () => $('btn-theme').setAttribute('aria-pressed', isDark() ? 'true' : 'false');
$('btn-theme').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark', system = mqDark && mqDark.matches ? 'dark' : 'light';
  // picking what the system already shows clears the choice, so the page follows the system again
  if (next === system) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', next);
  try { if (next === system) localStorage.removeItem('wentaoz.theme'); else localStorage.setItem('wentaoz.theme', next); } catch (e) {}
  showTheme();
});
if (mqDark && mqDark.addEventListener) mqDark.addEventListener('change', showTheme);
showTheme();
$('btn-theme').hidden = false;

// ---------- the photo ----------
// Scaled to at most MAX_SIDE on the long side and sent as JPEG; the browser applies the photo's
// rotation when it decodes it.
async function takePhoto(file) {
  const T = I18N[state.lang];
  say('ask-msg', '');
  if (!file) return;
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const sc = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const data = cv.toDataURL('image/jpeg', 0.85);
    state.photo = data.split(',')[1];
    $('photo-img').src = data;
    $('photo').hidden = false; $('drop').hidden = true;
  } catch (e) {
    say('ask-msg', T.badPhoto, true);
  } finally {
    URL.revokeObjectURL(url);
  }
}
function dropPhoto() { state.photo = null; $('photo-img').removeAttribute('src'); $('photo').hidden = true; $('drop').hidden = false; $('file').value = ''; }
$('file').addEventListener('change', (e) => takePhoto(e.target.files && e.target.files[0]));
$('photo-change').addEventListener('click', () => $('file').click());
$('photo-drop').addEventListener('click', dropPhoto);
const drop = $('drop');
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); takePhoto(e.dataTransfer.files && e.dataTransfer.files[0]); });

renderKeyMode();

// ---------- the answer ----------
// state.last holds what has come back so far: { steps: [{ kind, arg }], verdict, text, done, error }.
// Everything is drawn from it, so switching language redraws the answer too.
function stepText(s) {
  const T = I18N[state.lang];
  if (s.kind === 'read') return T.stepRead;
  if (s.kind === 'text') return T.stepText;
  if (s.kind === 'lookup') return T.stepLookup(s.arg);
  if (s.kind === 'search') return T.stepSearch(s.arg);
  if (s.kind === 'cached') return T.stepCached(s.arg);
  return T.stepDone;
}
function renderSteps() {
  const L = state.last;
  $('steps').innerHTML = L.steps.map((s, i) => `<li class="${!L.done && i === L.steps.length - 1 ? 'now' : ''}"><span>${esc(stepText(s))}</span></li>`).join('');
}

function renderWine(w) {
  const T = I18N[state.lang];
  const facts = [[T.region, w.region], [T.grapes, w.grapes], [T.winemaker, w.winemaker], [T.drink, w.drink_window]].filter(([, v]) => v);
  return `<section class="wine">` +
    `<p class="kicker">${esc(T.kicker)} · <b>${esc(T.conf[w.confidence] || '')}</b></p>` +
    `<h3 class="wine-name">${esc(w.producer)}${w.name ? `<span class="cuvee">${esc(w.name)}${w.vintage ? `<span class="vint">${esc(w.vintage)}</span>` : ''}</span>` : w.vintage ? `<span class="vint">${esc(w.vintage)}</span>` : ''}</h3>` +
    (facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : '') +
    (w.notes ? `<p class="wine-notes">${esc(w.notes)}</p>` : '') +
    `</section>`;
}

// 杰神's dot and every other critic's on one stretch of the 100-point scale
function renderCritics(j, critics) {
  const T = I18N[state.lang];
  const num = (s) => { const m = String(s).match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; };
  const others = critics.map((c) => ({ who: c.critic, label: c.score, url: c.url, v: num(c.score) })).filter((c) => c.v >= 50 && c.v <= SCALE);
  if (!others.length || !(j.score_value >= 50)) return '';
  const all = [j.score_value, ...others.map((c) => c.v)];
  const lo = Math.max(50, Math.min(Math.floor(Math.min(...all)) - 2, SCALE - 10)), hi = SCALE;
  const at = (v) => ((Math.min(Math.max(v, lo), hi) - lo) / (hi - lo)) * 100;
  // labels of dots that land on top of each other are dropped; the list below still names everyone
  const dots = [{ who: T.jie, label: j.score, v: j.score_value, jie: true }, ...others];
  let lastAt = -99;
  const marks = dots.slice().sort((a, b) => a.v - b.v).map((d) => {
    const x = at(d.v), show = d.jie || x - lastAt > 8;
    if (show) lastAt = x;
    return `<span class="dot${d.jie ? ' jie' + (j.source === 'predicted' ? ' hollow' : '') : ''}" style="left:${x.toFixed(1)}%">${show ? `<b>${esc(d.label)}</b>` : ''}</span>`;
  }).join('');
  return `<div class="critics"><h4>${esc(T.criticsH)}</h4><div class="track">${marks}</div>` +
    `<div class="ticks"><span>${lo}</span><span>${hi}</span></div>` +
    `<ul class="who"><li>${esc(T.jie)} <b>${esc(j.score)}</b></li>${others.map((c) =>
      `<li>${isUrl(c.url) ? `<a href="${esc(c.url)}" rel="noopener noreferrer" target="_blank">${esc(c.who)}</a>` : esc(c.who)} <b>${esc(c.label)}</b></li>`).join('')}</ul></div>`;
}

function renderVerdict(v) {
  const T = I18N[state.lang], w = v.wine, j = v.jieshen;
  if (!w.identified || j.source === 'none') {
    return `<article class="verdict none"><div class="seal"><span class="stamp">${esc(T.stamp.none)}</span><span class="score">?</span></div>` +
      `<div class="say"><p class="why">${esc(w.notes || T.notWine)}</p><p class="byline">${esc(T.notWine)}</p></div></article>`;
  }
  const srcs = j.sources.filter((s) => isUrl(s.url));
  const scale = T.scaleOf[j.scale] ? j.scale : '100';
  // the producer without its Chinese name, for searching his articles, where he writes names in English
  const who = w.producer.replace(/\s*[（(][^）)]*[）)]\s*/g, ' ').trim();
  return renderWine(w) +
    `<article class="verdict ${j.source}">` +
    `<div class="seal"><span class="stamp">${esc(T.stamp[j.source])}</span><span class="score${scale === 'words' ? ' words' : [...j.score].length > 3 ? ' long' : ''}">${esc(j.score).replace(/★/g, '<i class="star">★</i>')}</span><span class="scale">${esc(T.scaleOf[scale])}</span></div>` +
    `<div class="say">` +
    (j.history ? `<p class="history"><b>${esc(T.historyH)}</b>${esc(j.history)}</p>` : '') +
    (j.interest ? `<p class="interest"><b>${esc(T.interestH)}</b>${esc(j.interest)}</p>` : '') +
    (j.review ? `<p class="review">${esc(j.review)}</p>` : '') +
    `<p class="byline">${esc(j.source === 'found' ? T.byFound : T.byPredicted)}</p>` +
    (j.reasoning ? `<p class="why-h">${esc(T.whyH)}</p><p class="why">${esc(j.reasoning)}</p>` : '') +
    (scale === '100' ? `<p class="key">${esc(T.key)}</p>` : '') +
    (srcs.length ? `<p class="why-h">${esc(T.srcH[j.source])}</p><ul class="srcs">${srcs.map((s) =>
      `<li><a href="${esc(s.url)}" rel="noopener noreferrer" target="_blank">${esc(s.title || host(s.url))}</a>${s.date ? `<span class="d">${esc(s.date)}</span>` : ''}</li>`).join('')}</ul>` : '') +
    (j.source === 'predicted' && who ? `<p class="sogou"><a href="https://weixin.sogou.com/weixin?type=2&amp;query=${encodeURIComponent('杰神 ' + who)}" rel="noopener noreferrer" target="_blank">${esc(T.sogou(who))}</a><br>${esc(T.sogouHint)}</p>` : '') +
    `</div></article>` +
    renderCritics(j, v.critics || []) +
    (j.source === 'predicted' ? `<p class="fine">${esc(T.fine)}</p>` : '');
}

function renderOut() {
  const T = I18N[state.lang], L = state.last;
  $('step-out').hidden = false;
  renderSteps();
  let html = '';
  if (L.verdict) html = renderVerdict(L.verdict);
  else if (L.text) html = `<p class="byline">${esc(T.noVerdict)}</p><div class="prose">${L.text.split(/\n{2,}/).map((p) => `<p>${esc(p)}</p>`).join('')}</div>`;
  $('out').innerHTML = html;
  let meta = '';
  if (L.usage) {
    const u = L.usage;
    const cost = ((u.input + u.cacheWrite * 1.25 + u.cacheRead * 0.1) * PRICE.input + u.output * PRICE.output) / 1e6 + u.searches * PRICE.search;
    meta = L.kept && cost === 0 ? T.free : T.usage(u, cost.toFixed(3));
    if (L.kept) meta = T.kept(L.kept) + ' · ' + meta;
  }
  setText('meta', meta);
  $('again').hidden = !(L.kept && L.done);
  if (L.stop === 'refusal') say('ask-msg', T.refusal, true);
  else if (L.stop === 'max_tokens' && !L.verdict) say('ask-msg', T.truncated, true);
  else if (L.stop && !L.verdict && !L.text) say('ask-msg', T.noAnswer, true);
}

// One event from runSimulator (sim.js), whether it came through the Worker or ran in this browser
function onEvent(ev) {
  const L = state.last;
  if (ev.type === 'lookup') L.steps.push({ kind: 'lookup', arg: ev.producer });
  else if (ev.type === 'search') L.steps.push({ kind: 'search', arg: ev.query });
  else if (ev.type === 'cached') { L.kept = ev.at; L.steps.push({ kind: 'cached', arg: ev.at }); }
  else if (ev.type === 'verdict') L.verdict = ev.verdict;
  else if (ev.type === 'text') L.text = ev.text;
  else if (ev.type === 'done') { L.done = true; L.stop = ev.stop; L.usage = ev.usage; L.steps.push({ kind: 'done' }); }
  else if (ev.type === 'error') { const err = new Error(ev.message || 'error'); err.status = ev.status; throw err; }
  renderOut();
}

// The Worker's answer: one JSON event per line
async function askSite(input) {
  const res = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(input) });
  if (!res.ok) { const err = new Error((await res.json().catch(() => ({}))).error || res.statusText); err.status = res.status; throw err; }
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
      if (line) onEvent(JSON.parse(line));
    }
  }
  if (buf.trim()) onEvent(JSON.parse(buf));
  if (!state.last.done) throw new Error('the answer was cut off');
}

// Asks the same question again without the kept answer
$('again-btn').addEventListener('click', () => { state.fresh = true; $('ask').requestSubmit(); });

$('ask').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fresh = state.fresh; state.fresh = false;
  if (state.busy) return;
  const T = I18N[state.lang];
  const text = $('text-input').value.trim().slice(0, 200);
  if (!state.photo && !text) { say('ask-msg', T.needInput, true); return; }
  const own = $('own-key').checked, key = $('key-input').value.trim();
  if (own && !key.startsWith('sk-')) { say('ask-msg', T.needKey, true); $('key-input').focus(); return; }
  if (own) try { if ($('key-keep').checked) localStorage.setItem(KEY_KEY, key); else localStorage.removeItem(KEY_KEY); } catch (err) {}

  state.busy = true; $('go').disabled = true; setText('go', T.going);
  say('ask-msg', '');
  state.last = { steps: [{ kind: state.photo ? 'read' : 'text' }], verdict: null, text: '', done: false };
  renderOut();
  $('step-out').scrollIntoView({ behavior: 'smooth', block: 'start' });
  const input = { lang: state.lang, text, image: state.photo || null };
  if (fresh) input.fresh = true;
  try {
    if (!own) await askSite(input);
    else {
      const [{ default: Anthropic }, sim] = await Promise.all([import(`${SDK}/+esm`), import('./sim.js')]);
      const problem = sim.checkInput(input);
      if (problem) throw new Error(problem);
      // The key is the visitor's own, typed into their own browser and sent only to Anthropic
      const client = new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true });
      await sim.runSimulator(client, input, onEvent);
    }
  } catch (err) {
    const L = state.last;
    L.done = true; renderOut();
    if (!L.verdict && !L.text) { $('out').innerHTML = ''; $('steps').innerHTML = ''; }
    const st = err && err.status, E = I18N[state.lang].err;
    const why = String((err && err.message) || err), net = !st && /fetch|network|connection|load failed/i.test(why);
    // On the site's key, a bad key, a spent credit or a missing Worker is the site's problem, not the
    // visitor's: those all read as "unavailable" and point to the visitor's own key
    const m = !own
      ? st === 429 ? E.siteBusy : st >= 500 && why !== 'not_configured' ? E[529]
        : [401, 402, 403, 404, 503].includes(st) || (st === 400 && /credit|limit|billing|web search/i.test(why)) ? E.siteDown
        : net ? E.siteNet : E.other(why)
      : st === 401 ? E[401] : st === 403 ? E[403] : st === 429 ? E[429] : st === 529 || st === 503 ? E[529]
        : net ? E.net : E.other(why);
    say('ask-msg', m, true);
  } finally {
    state.busy = false; $('go').disabled = false; setText('go', I18N[state.lang].go);
  }
});

// ---------- boot ----------
renderStatic();
</script>
<!-- GoatCounter: counts visits without cookies; the totals feed the visitor map on the homepage. -->
<script data-goatcounter="https://wentaoz.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
